name: Build and Push Docker Images

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Deployment Environment"
        required: true
        default: "dev"
        type: choice
        options:
          - dev
          - staging
          - prod

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
  ECR_REGISTRY: ${{ vars.ECR_REGISTRY }}
  IMAGE_TAG: ${{ github.run_number }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: refs/heads/CICD_DockerImage_ECR_EC2

      - name: Cleanup Docker Images
        run: |
          echo "Cleaning old Docker resources..."
          docker image prune -af || true
          docker container prune -f || true

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Login to Public ECR
        run: |
          aws ecr-public get-login-password --region us-east-1 \
          | docker login \
            --username AWS \
            --password-stdin \
            ${{ env.ECR_REGISTRY }}

      - name: Build Admin Service
        run: |
          docker build \
            -f backend/adminService/Dockerfile \
            -t adminservice:${{ github.run_number }} .

          docker tag \
            adminservice:${{ github.run_number }} \
            ${{ env.ECR_REGISTRY }}/capstone/adminservice:${{ github.run_number }}

          docker push \
            ${{ env.ECR_REGISTRY }}/capstone/adminservice:${{ github.run_number }}

      - name: Build Auth Services
        run: |
          docker build \
            -f backend/authService/Dockerfile \
            -t authservice:${{ github.run_number }} .

          docker tag \
            authservice:${{ github.run_number }} \
            ${{ env.ECR_REGISTRY }}/capstone/authservice:${{ github.run_number }}

          docker push \
            ${{ env.ECR_REGISTRY }}/capstone/authservice:${{ github.run_number }}

      - name: Build Chat Service
        run: |
          docker build \
            -f backend/chatService/Dockerfile \
            -t chatservice:${{ github.run_number }} .

          docker tag \
            chatservice:${{ github.run_number }} \
            ${{ env.ECR_REGISTRY }}/capstone/chatservice:${{ github.run_number }}

          docker push \
            ${{ env.ECR_REGISTRY }}/capstone/chatservice:${{ github.run_number }}

      - name: Build Streaming Service
        run: |
          docker build \
            -f backend/streamingService/Dockerfile \
            -t streamingservice:${{ github.run_number }} .

          docker tag \
            streamingservice:${{ github.run_number }} \
            ${{ env.ECR_REGISTRY }}/capstone/streamingservice:${{ github.run_number }}

          docker push \
            ${{ env.ECR_REGISTRY }}/capstone/streamingservice:${{ github.run_number }}

      - name: Build Frontend
        run: |
          docker build \
            -f frontend/Dockerfile \
            -t frontend:${{ github.run_number }} .

          docker tag \
            frontend:${{ github.run_number }} \
            ${{ env.ECR_REGISTRY }}/capstone/frontend:${{ github.run_number }}

          docker push \
            ${{ env.ECR_REGISTRY }}/capstone/frontend:${{ github.run_number }}

      - name: Deployment Success
        if: success()
        run: |
          echo "✅ Deployment Successful - Build Version: $IMAGE_TAG"

      - name: Deployment Failed
        if: failure()
        run: |
          echo "❌ Deployment Failed - Build Version: $IMAGE_TAG"
