name: Build, Push, and Deploy StreamingApp

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Deployment environment"
        required: true
        default: "uat"
        type: choice
        options:
          - uat
          - prod
      operation:
        description: "Deploy the application or manually destroy UAT infrastructure"
        required: true
        default: "deploy"
        type: choice
        options:
          - deploy
          - destroy
      confirm_destroy:
        description: "Required confirmation when operation is destroy"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  build-and-deploy:
    if: ${{ inputs.operation == 'deploy' }}
    name: Build, push, and deploy ${{ inputs.environment }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: helm-streamingapp-${{ inputs.environment }}
      cancel-in-progress: false
    env:
      DEPLOY_ENV: ${{ inputs.environment }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
      EKS_CLUSTER_NAME: ${{ vars.EKS_CLUSTER_NAME || format('streamingapp-{0}-eks', inputs.environment) }}
      AWS_S3_BUCKET: ${{ vars.AWS_S3_BUCKET }}
      APP_MEDIA_ROLE_ARN: ${{ vars.APP_MEDIA_ROLE_ARN }}
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      TF_LOCK_TABLE: ${{ vars.TF_LOCK_TABLE }}
      TF_VAR_aws_region: ${{ vars.AWS_REGION }}
      TF_VAR_environment: ${{ inputs.environment }}
      TF_VAR_cluster_public_access_cidrs: ${{ vars.CLUSTER_PUBLIC_ACCESS_CIDRS }}
      NAMESPACE: streamingapp-${{ inputs.environment }}
      RELEASE: streamingapp-${{ inputs.environment }}
      IMAGE_TAG: ${{ github.run_number }}-${{ github.run_attempt }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: feature_terraform

      - name: Setup Helm
        uses: azure/setup-helm@v4

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4

      - name: Debug Helm chart path
        shell: bash
        run: |
          pwd
          ls -la
          find . -name Chart.yaml -print
          test -f ./helm/streamingapp/Chart.yaml

      - name: Check deployment configuration
        env:
          AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
        shell: bash
        run: |
          for name in AWS_ROLE_ARN AWS_REGION AWS_ACCOUNT_ID; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing required GitHub environment secret or variable for ${name}"
              exit 1
            fi
          done

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS account
        shell: bash
        run: |
          account_id="$(aws sts get-caller-identity --query Account --output text)"
          if [[ "$account_id" != "$AWS_ACCOUNT_ID" ]]; then
            echo "::error::Authenticated AWS account does not match AWS_ACCOUNT_ID"
            exit 1
          fi

      - name: Check for the configured EKS cluster
        id: eks-preflight
        shell: bash
        run: |
          set -Eeuo pipefail
          region_list="$(aws ec2 describe-regions \
            --query 'Regions[?OptInStatus==`opt-in-not-required` || OptInStatus==`opted-in`].RegionName' \
            --output text)"
          mapfile -t regions < <(tr '\t' '\n' <<< "$region_list")
          found_clusters=()
          matching_regions=()

          for region in "${regions[@]}"; do
            cluster_names="$(aws eks list-clusters --region "$region" \
              --query 'clusters[]' --output text)"
            [[ -z "$cluster_names" || "$cluster_names" == "None" ]] && continue

            while IFS= read -r cluster_name; do
              [[ -z "$cluster_name" ]] && continue
              if [[ "$cluster_name" == "$EKS_CLUSTER_NAME" ]]; then
                matching_regions+=("$region")
                continue
              fi
              found_clusters+=("$cluster_name ($region)")
            done < <(tr '\t' '\n' <<< "$cluster_names")
          done

          if [[ " ${matching_regions[*]} " == *" $AWS_REGION "* ]]; then
            echo "cluster_exists=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if (( ${#matching_regions[@]} > 0 )); then
            printf 'Cluster %s found in region(s): %s\n' "$EKS_CLUSTER_NAME" "${matching_regions[*]}"
            echo "::error::Cluster $EKS_CLUSTER_NAME exists in a different region. Update the $DEPLOY_ENV environment's AWS_REGION variable and rerun."
            exit 1
          fi

          if (( ${#found_clusters[@]} > 0 )); then
            printf 'Clusters found in this AWS account:\n%s\n' "${found_clusters[*]}"
            echo "::error::No cluster named $EKS_CLUSTER_NAME was found. Update the $DEPLOY_ENV environment's EKS_CLUSTER_NAME and AWS_REGION variables if one of these is the target."
            exit 1
          fi

          if [[ "$DEPLOY_ENV" != "uat" ]]; then
            echo "::error::No EKS cluster found. Automatic Terraform provisioning is enabled only for UAT."
            exit 1
          fi

          echo "::notice::No EKS clusters found in this account. Terraform will provision UAT infrastructure."
          echo "cluster_exists=false" >> "$GITHUB_OUTPUT"

      - name: Check Terraform bootstrap configuration
        if: steps.eks-preflight.outputs.cluster_exists == 'false'
        shell: bash
        run: |
          for name in TF_STATE_BUCKET TF_LOCK_TABLE TF_VAR_cluster_public_access_cidrs; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing required GitHub UAT environment variable for Terraform: ${name}"
              exit 1
            fi
          done

      - name: Setup Terraform
        if: steps.eks-preflight.outputs.cluster_exists == 'false'
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.5

      - name: Apply Terraform for UAT
        if: steps.eks-preflight.outputs.cluster_exists == 'false'
        working-directory: terraform
        shell: bash
        run: |
          set -Eeuo pipefail
          terraform fmt -check -recursive
          terraform init -input=false \
            -backend-config="bucket=${TF_STATE_BUCKET}" \
            -backend-config="key=streamingapp/uat/terraform.tfstate" \
            -backend-config="region=${AWS_REGION}" \
            -backend-config="encrypt=true" \
            -backend-config="dynamodb_table=${TF_LOCK_TABLE}"
          terraform validate
          terraform plan -input=false -lock-timeout=5m -out=tfplan
          terraform apply -input=false -auto-approve -lock-timeout=5m tfplan

      - name: Load UAT outputs and wait for EKS
        if: steps.eks-preflight.outputs.cluster_exists == 'false'
        working-directory: terraform
        shell: bash
        run: |
          set -Eeuo pipefail
          cluster_name="$(terraform output -raw cluster_name)"
          media_bucket="$(terraform output -raw media_bucket_name)"
          app_media_role="$(terraform output -raw app_media_access_role_arn)"
          if [[ -z "$cluster_name" || -z "$media_bucket" || -z "$app_media_role" ]]; then
            echo "::error::Terraform did not return the expected UAT cluster, bucket, and app role outputs."
            exit 1
          fi
          if [[ "$cluster_name" != "$EKS_CLUSTER_NAME" ]]; then
            echo "::warning::Terraform created $cluster_name; update the UAT EKS_CLUSTER_NAME variable to match."
          fi
          {
            echo "EKS_CLUSTER_NAME=$cluster_name"
            echo "AWS_S3_BUCKET=$media_bucket"
            echo "APP_MEDIA_ROLE_ARN=$app_media_role"
          } >> "$GITHUB_ENV"

          aws eks wait cluster-active --region "$AWS_REGION" --name "$cluster_name"
          nodegroups="$(aws eks list-nodegroups --region "$AWS_REGION" \
            --cluster-name "$cluster_name" --query 'nodegroups[]' --output text)"
          if [[ -n "$nodegroups" && "$nodegroups" != "None" ]]; then
            for nodegroup in $nodegroups; do
              aws eks wait nodegroup-active --region "$AWS_REGION" \
                --cluster-name "$cluster_name" --nodegroup-name "$nodegroup"
            done
          fi

      - name: Validate deployment settings and configure EKS access
        shell: bash
        run: |
          set -Eeuo pipefail
          for name in AWS_S3_BUCKET APP_MEDIA_ROLE_ARN; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing required GitHub environment variable: ${name}"
              exit 1
            fi
          done
          aws eks update-kubeconfig --region "$AWS_REGION" --name "$EKS_CLUSTER_NAME"
          for attempt in {1..30}; do
            if kubectl get nodes; then
              exit 0
            fi
            echo "Waiting for EKS nodes and Kubernetes access ($attempt/30)"
            sleep 20
          done
          echo "::error::Could not access EKS nodes after waiting."
          exit 1

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push application images
        env:
          IMAGE_PREFIX: ${{ steps.ecr-login.outputs.registry }}/streamingapp-${{ inputs.environment }}
          IMAGE_TAG: ${{ env.IMAGE_TAG }}
          REACT_APP_AUTH_API_URL: /api
          REACT_APP_STREAMING_API_URL: /api
          REACT_APP_STREAMING_PUBLIC_URL: /
          REACT_APP_ADMIN_API_URL: /api/admin
          REACT_APP_CHAT_API_URL: /api/chat
          REACT_APP_CHAT_SOCKET_URL: /
        shell: bash
        run: |
          set -Eeuo pipefail
          docker compose build auth streaming admin chat frontend
          docker compose push auth streaming admin chat frontend

      - name: Deploy the pushed images to EKS with Helm
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
        shell: bash
        run: |
          set -Eeuo pipefail

          helm_args=(
            --set-string "services.auth.image=${REGISTRY}/streamingapp-${DEPLOY_ENV}-auth:${IMAGE_TAG}"
            --set-string "services.streaming.image=${REGISTRY}/streamingapp-${DEPLOY_ENV}-streaming:${IMAGE_TAG}"
            --set-string "services.admin.image=${REGISTRY}/streamingapp-${DEPLOY_ENV}-admin:${IMAGE_TAG}"
            --set-string "services.chat.image=${REGISTRY}/streamingapp-${DEPLOY_ENV}-chat:${IMAGE_TAG}"
            --set-string "services.frontend.image=${REGISTRY}/streamingapp-${DEPLOY_ENV}-frontend:${IMAGE_TAG}"
            --set-string "awsRegion=${AWS_REGION}"
            --set-string "objectStorage.bucket=${AWS_S3_BUCKET}"
            --set-string "services.streaming.env.AWS_S3_BUCKET=${AWS_S3_BUCKET}"
            --set-string "services.admin.env.AWS_S3_BUCKET=${AWS_S3_BUCKET}"
            --set-string "serviceAccount.name=streamingapp-${DEPLOY_ENV}-app"
            --set-string "serviceAccount.annotations.eks\\.amazonaws\\.com/role-arn=${APP_MEDIA_ROLE_ARN}"
          )

          helm lint ./helm/streamingapp "${helm_args[@]}"
          helm template "$RELEASE" ./helm/streamingapp \
            --namespace "$NAMESPACE" "${helm_args[@]}" >/dev/null

          kubectl create namespace "$NAMESPACE" \
            --dry-run=client -o yaml | kubectl apply -f -

          if ! kubectl --namespace "$NAMESPACE" get secret streamingapp-runtime >/dev/null 2>&1; then
            jwt_secret="$(openssl rand -hex 32)"
            kubectl --namespace "$NAMESPACE" create secret generic streamingapp-runtime \
              --from-literal="jwt-secret=${jwt_secret}"
            unset jwt_secret
          fi

          helm upgrade --install "$RELEASE" ./helm/streamingapp \
            --namespace "$NAMESPACE" --create-namespace \
            "${helm_args[@]}" --wait --timeout 10m

          ingress_hostname=""
          for attempt in {1..60}; do
            ingress_hostname="$(kubectl --namespace "$NAMESPACE" \
              get ingress "$RELEASE" \
              -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' 2>/dev/null || true)"
            [[ -n "$ingress_hostname" ]] && break
            sleep 10
          done
          if [[ -z "$ingress_hostname" ]]; then
            kubectl --namespace "$NAMESPACE" describe ingress "$RELEASE" || true
            echo "::error::Ingress has no load balancer hostname; check the AWS Load Balancer Controller"
            exit 1
          fi

          app_origin="http://${ingress_hostname}"
          helm upgrade "$RELEASE" ./helm/streamingapp \
            --namespace "$NAMESPACE" "${helm_args[@]}" \
            --set-string "services.auth.env.CLIENT_URLS=${app_origin}" \
            --set-string "services.streaming.env.CLIENT_URLS=${app_origin}" \
            --set-string "services.admin.env.CLIENT_URLS=${app_origin}" \
            --set-string "services.chat.env.CLIENT_URLS=${app_origin}" \
            --set-string "services.streaming.env.STREAMING_PUBLIC_URL=${app_origin}" \
            --set-string "services.admin.env.STREAMING_PUBLIC_URL=${app_origin}" \
            --wait --timeout 10m

          kubectl --namespace "$NAMESPACE" \
            wait --for=condition=Available deployment --all --timeout=10m

          for attempt in {1..12}; do
            if curl -sf --max-time 10 "http://${ingress_hostname}/" >/dev/null; then
              echo "Application is reachable at http://${ingress_hostname}/"
              break
            fi
            if [[ "$attempt" -eq 12 ]]; then
              echo "::error::Application smoke test failed"
              exit 1
            fi
            sleep 15
          done

          kubectl --namespace "$NAMESPACE" get deployments,pods,services,pvc,ingress

      - name: Deployment success
        if: success()
        run: echo "Build ${IMAGE_TAG} was pushed to ECR and deployed to ${EKS_CLUSTER_NAME}"

      - name: Deployment failed
        if: failure()
        run: echo "Build and deployment failed; review the failed step logs."

  destroy-uat:
    if: ${{ inputs.operation == 'destroy' }}
    name: Manually destroy UAT infrastructure
    runs-on: ubuntu-latest
    environment: uat
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: terraform-uat
      cancel-in-progress: false
    env:
      REQUESTED_ENVIRONMENT: ${{ inputs.environment }}
      CONFIRM_DESTROY: ${{ inputs.confirm_destroy }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
      AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
      EKS_CLUSTER_NAME: ${{ vars.EKS_CLUSTER_NAME || 'streamingapp-uat-eks' }}
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      TF_LOCK_TABLE: ${{ vars.TF_LOCK_TABLE }}
      TF_VAR_aws_region: ${{ vars.AWS_REGION }}
      TF_VAR_environment: uat
      TF_VAR_cluster_public_access_cidrs: '["10.0.0.0/8"]'
      NAMESPACE: streamingapp-uat
      RELEASE: streamingapp-uat
    steps:
      - name: Validate manual destroy request
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ "$REQUESTED_ENVIRONMENT" != "uat" ]]; then
            echo "::error::This destroy operation is restricted to UAT. Select uat as the environment."
            exit 1
          fi
          if [[ "$CONFIRM_DESTROY" != "true" ]]; then
            echo "::error::Check confirm_destroy to authorize teardown of UAT resources."
            exit 1
          fi
          for name in AWS_ROLE_ARN AWS_REGION AWS_ACCOUNT_ID TF_STATE_BUCKET TF_LOCK_TABLE; do
            if [[ -z "${!name}" || "${!name}" == "$name" ]]; then
              echo "::error::Missing required UAT GitHub environment secret or variable: ${name}"
              exit 1
            fi
          done

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: feature_terraform

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS account
        shell: bash
        run: |
          account_id="$(aws sts get-caller-identity --query Account --output text)"
          if [[ "$account_id" != "$AWS_ACCOUNT_ID" ]]; then
            echo "::error::Authenticated AWS account does not match AWS_ACCOUNT_ID; refusing to destroy."
            exit 1
          fi

      - name: Setup Helm
        uses: azure/setup-helm@v4

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.5

      - name: Initialize UAT Terraform state
        working-directory: terraform
        shell: bash
        run: |
          set -Eeuo pipefail
          terraform init -input=false \
            -backend-config="bucket=${TF_STATE_BUCKET}" \
            -backend-config="key=streamingapp/uat/terraform.tfstate" \
            -backend-config="region=${AWS_REGION}" \
            -backend-config="encrypt=true" \
            -backend-config="dynamodb_table=${TF_LOCK_TABLE}"

      - name: Remove UAT Helm release
        shell: bash
        run: |
          set -Eeuo pipefail
          cluster_names="$(aws eks list-clusters --region "$AWS_REGION" \
            --query 'clusters[]' --output text)"
          if [[ -z "$cluster_names" || "$cluster_names" == "None" ]] ||
            ! grep -Fxq "$EKS_CLUSTER_NAME" <<< "$(tr '\t' '\n' <<< "$cluster_names")"; then
            echo "UAT EKS cluster is absent; skipping Helm cleanup."
            exit 0
          fi

          aws eks update-kubeconfig --region "$AWS_REGION" --name "$EKS_CLUSTER_NAME"
          helm uninstall "$RELEASE" --namespace "$NAMESPACE" \
            --ignore-not-found --wait --timeout 10m
          kubectl delete namespace "$NAMESPACE" \
            --ignore-not-found=true --wait=true --timeout=10m

      - name: Destroy UAT Terraform infrastructure
        working-directory: terraform
        shell: bash
        run: |
          set -Eeuo pipefail
          terraform destroy -input=false -auto-approve -lock-timeout=10m
