apiVersion: apps/v1
kind: Deployment
metadata:
 name: chat
 namespace: streamingapp

spec:
  replicas: 2

  selector:
    matchLabels:
      app: chat

  template:
    metadata:
      labels:
        app: chat

    spec:
      containers:
      - name: chat
        image: 488347380015.dkr.ecr.ap-south-1.amazonaws.com/streamingapp-chat:5

        imagePullPolicy: Always

        ports:
        - containerPort: 3004

        envFrom:
        - configMapRef:
            name: streamingapp-config
        - secretRef:
            name: streamingapp-secret
