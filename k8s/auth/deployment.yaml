apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth
  namespace: streamingapp

spec:
  replicas: 2

  selector:
    matchLabels:
      app: auth

  template:
    metadata:
      labels:
        app: auth

    spec:
      containers:
      - name: auth
        image: 488347380015.dkr.ecr.ap-south-1.amazonaws.com/streamingapp-auth:5

        imagePullPolicy: Always

        ports:
        - containerPort: 3001

        envFrom:
        - configMapRef:
            name: streamingapp-config
        - secretRef:
            name: streamingapp-secret
