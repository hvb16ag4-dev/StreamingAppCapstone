{{- $serviceAccount := .Values.serviceAccount | default dict }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ default (printf "%s-app" .Release.Name) $serviceAccount.name | quote }}
  labels:
    app.kubernetes.io/part-of: streamingapp
{{- with $serviceAccount.annotations }}
  annotations:
{{ toYaml . | indent 4 }}
{{- end }}
