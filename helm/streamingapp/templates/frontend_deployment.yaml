apiVersion: apps/v1
kind: Deployment
metadata:
 name: frontend
 namespace: {{ .Values.namespace }}

spec:
  replicas: {{ .Values.replicaCount }}

  selector:
    matchLabels:
      app: frontend

  template:
    metadata:
      labels:
        app: frontend

    spec:
      containers:
      - name: frontend
        image: "{{ .Values.accountId }}.dkr.ecr.{{ .Values.region }}.amazonaws.com/{{ .Values.images.frontend.repository }}:{{ .Values.images.frontend.tag }}"

        imagePullPolicy: {{ .Values.imagePullPolicy }}

        ports:
        - containerPort: 80

        envFrom:
        - configMapRef:
            name: streamingapp-config
        - secretRef:
            name: streamingapp-secret
