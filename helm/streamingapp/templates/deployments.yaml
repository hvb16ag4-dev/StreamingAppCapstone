{{- if .Values.mongo.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-mongo
  labels:
    app.kubernetes.io/name: {{ .Release.Name }}-mongo
    app.kubernetes.io/part-of: streamingapp
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Release.Name }}-mongo
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Release.Name }}-mongo
    spec:
      containers:
        - name: mongo
          image: {{ .Values.mongo.image | quote }}
          ports:
            - containerPort: {{ .Values.mongo.port }}
          volumeMounts:
            - name: mongo-data
              mountPath: /data/db
      volumes:
        - name: mongo-data
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-mongo-data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Release.Name }}-mongo-data
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.mongo.storage }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-mongo
  labels:
    app.kubernetes.io/name: {{ .Release.Name }}-mongo
spec:
  selector:
    app.kubernetes.io/name: {{ .Release.Name }}-mongo
  ports:
    - name: mongo
      port: {{ .Values.mongo.port }}
      targetPort: {{ .Values.mongo.port }}
{{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-auth
  labels:
    app.kubernetes.io/name: {{ .Release.Name }}-auth
    app.kubernetes.io/part-of: streamingapp
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Release.Name }}-auth
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Release.Name }}-auth
    spec:
      containers:
        - name: auth
          image: {{ .Values.services.auth.image | quote }}
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: {{ .Values.services.auth.port }}
          env:
            - name: PORT
              value: {{ .Values.services.auth.env.PORT | quote }}
            - name: MONGO_URI
              value: "mongodb://{{ .Release.Name }}-mongo:{{ .Values.mongo.port }}/{{ .Values.services.auth.env.MONGO_DATABASE }}"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.existingSecret | quote }}
                  key: jwt-secret
            - name: CLIENT_URLS
              value: {{ .Values.services.auth.env.CLIENT_URLS | quote }}
            - name: AWS_REGION
              value: {{ .Values.services.auth.env.AWS_REGION | quote }}
            - name: AWS_S3_BUCKET
              value: {{ .Values.services.auth.env.AWS_S3_BUCKET | quote }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-auth
  labels:
    app.kubernetes.io/name: {{ .Release.Name }}-auth
spec:
  selector:
    app.kubernetes.io/name: {{ .Release.Name }}-auth
  ports:
    - name: http
      port: {{ .Values.services.auth.port }}
      targetPort: {{ .Values.services.auth.port }}
