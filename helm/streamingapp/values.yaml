replicaCount: 1

awsRegion: ap-south-1

mongo:
  enabled: true
  image: mongo:6
  port: 27017
  storage: 5Gi

secrets:
  existingSecret: streamingapp-runtime

objectStorage:
  bucket: ""
  endpoint: ""
  forcePathStyle: false
  credentialsSecret: ""
  accessKeyIdKey: access-key-id
  secretAccessKeyKey: secret-access-key
  sessionTokenKey: session-token

serviceAccount:
  name: ""
  annotations: {}

services:
  auth:
    image: "streamingappcapstone-auth:latest"
    port: 3001
    env:
      PORT: "3001"
      MONGO_DATABASE: "streamingapp"
      NODE_ENV: "production"
      CLIENT_URLS: "http://localhost:3000"
      AWS_S3_BUCKET: ""
  streaming:
    image: "streamingappcapstone-streaming:latest"
    port: 3002
    env:
      PORT: "3002"
      MONGO_DATABASE: "streamingapp"
      CLIENT_URLS: "http://localhost:3000"
      AWS_S3_BUCKET: ""
      AWS_CDN_URL: ""
      STREAMING_PUBLIC_URL: "http://localhost:3002"
  admin:
    image: "streamingappcapstone-admin:latest"
    port: 3003
    env:
      PORT: "3003"
      MONGO_DATABASE: "streamingapp"
      CLIENT_URLS: "http://localhost:3000"
      AWS_S3_BUCKET: ""
      AWS_CDN_URL: ""
  chat:
    image: "streamingappcapstone-chat:latest"
    port: 3004
    env:
      PORT: "3004"
      MONGO_DATABASE: "streamingapp"
      CLIENT_URLS: "http://localhost:3000"
  frontend:
    image: "streamingapp-frontend:k8s-local"
    port: 80

ingress:
  enabled: true
  className: "alb"
  host: ""
  annotations:
    kubernetes.io/ingress.class: "alb"
    alb.ingress.kubernetes.io/scheme: "internet-facing"
    alb.ingress.kubernetes.io/target-type: "ip"
    alb.ingress.kubernetes.io/backend-protocol: "HTTP"
