replicaCount: 1

mongo:
  enabled: true
  image: mongo:6
  port: 27017
  storage: 5Gi

secrets:
  existingSecret: streamingapp-runtime

services:
  auth:
    image: "123456789012.dkr.ecr.ap-south-1.amazonaws.com/streamingapp-auth:latest"
    port: 3001
    env:
      PORT: "3001"
      MONGO_DATABASE: "streamingapp"
      CLIENT_URLS: "http://localhost:3000"
      AWS_REGION: "ap-south-1"
      AWS_S3_BUCKET: "" 
  streaming:
    image: "123456789012.dkr.ecr.ap-south-1.amazonaws.com/streamingapp-streaming:latest"
    port: 3002
    env:
      PORT: "3002"
      MONGO_DATABASE: "streamingapp"
      CLIENT_URLS: "http://localhost:3000"
      AWS_REGION: "ap-south-1"
      AWS_S3_BUCKET: ""
      AWS_CDN_URL: ""
      STREAMING_PUBLIC_URL: "http://localhost:3002"
  admin:
    image: "123456789012.dkr.ecr.ap-south-1.amazonaws.com/streamingapp-admin:latest"
    port: 3003
    env:
      PORT: "3003"
      MONGO_DATABASE: "streamingapp"
      CLIENT_URLS: "http://localhost:3000"
      AWS_REGION: "ap-south-1"
      AWS_S3_BUCKET: ""
      AWS_CDN_URL: ""
  chat:
    image: "123456789012.dkr.ecr.ap-south-1.amazonaws.com/streamingapp-chat:latest"
    port: 3004
    env:
      PORT: "3004"
      MONGO_DATABASE: "streamingapp"
      CLIENT_URLS: "http://localhost:3000"
  frontend:
    image: "123456789012.dkr.ecr.ap-south-1.amazonaws.com/streamingapp-frontend:latest"
    port: 80

ingress:
  enabled: true
  className: "alb"
  host: ""
  annotations:
    kubernetes.io/ingress.class: "alb"
    alb.ingress.kubernetes.io/scheme: "internet-facing"
    alb.ingress.kubernetes.io/target-type: "ip"
    alb.ingress.kubernetes.io/backend-protocol: "HTTP"
